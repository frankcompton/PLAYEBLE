<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Playable</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="preloader">
        <div id="preloaderContent">
            <img id="preloaderLogo" alt="Loading">
            <div id="preloaderBar">
                <div id="preloaderProgress"></div>
            </div>
        </div>
    </div>

    <div id="fxLayer"></div>
    <div id="gameScaler">
        <div id="game">
            <div id="topWinPanel">
                <img id="gameLogo" alt="Coin Strike">
                <div id="welcomeBonusTitle">YOUR WELCOME BONUS</div>
                <div id="bonusBoxes">
                    <div class="bonusBox">
                        <div class="bonusLabel">CASH BONUS</div>
                        <div id="topWinPanelText" class="bonusValue">A$0</div>
                    </div>
                    <div class="bonusBox">
                        <div class="bonusLabel">FREE SPINS</div>
                        <div id="freeSpinsValue" class="bonusValue">0</div>
                    </div>
                </div>
            </div>

            <div id="slotStage">
                <div id="slotArea">
                    <div id="reels">
                        <div>
                            <div></div>
                        </div>

                        <div>
                            <div></div>
                        </div>

                        <div>
                            <div></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="bottomControls">
                <img id="tapHand" src="assets/hand.webp" alt="" aria-hidden="true">

                <button id="spinBtn">
                    <span id="spinText">UNLOCK BONUS</span>
                </button>

                    <div id="postSpinActions" aria-hidden="true">
                        <button id="getItOnBtn" type="button">
                        <img src="assets/getit.webp" alt="Get it on">
                    </button>
                    <button id="tryAgainBtn" type="button">
                        <span>TRY AGAIN</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="overlay"></div>

    <div id="ctaPopup">
        <div id="ctaTitle">BONUS UNLOCKED!</div>
        <div id="ctaAmount">A$1,500 + 250<br>FREE SPINS</div>
        <div id="ctaSubtitle">You received an exclusive bonus from Online Casino</div>
        <button id="ctaButton">CLAIM BONUS</button>
        <div id="ctaCountdown">
            <span id="ctaCountdownLabel">OFFER ENDS IN</span>
            <span id="ctaCountdownTime">30:00</span>
        </div>
    </div>

    <script src="assets/pixi.min.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
